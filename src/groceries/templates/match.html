{% extends "base.html" %}
{% block title %}{{ name }}{% endblock %}
{% block content %}
<h1>{{ name }}</h1>
<p class="hint">Products are saved against an item, so they're found again next time "{{ name }}" is on the list.</p>

<form method="post" action="/items" class="inline">
  <input type="hidden" name="name" value="{{ name }}">
  <button>New item "{{ name }}"</button>
</form>

{% if items %}
<p>Or it's another name for an item you already have:</p>
<form method="post" action="/aliases" class="inline">
  <input type="hidden" name="alias" value="{{ name }}">
  <select name="item_id">{% for i in items %}<option value="{{ i.id }}">{{ i.name }}</option>{% endfor %}</select>
  <button class="secondary">Same as this</button>
</form>
{% endif %}
{% endblock %}
